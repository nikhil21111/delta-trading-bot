# fly.toml app configuration file
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.

app = "delta-trading-bot"
primary_region = "sin"  # Singapore (closest to Asia markets)

[build]
  dockerfile = "Dockerfile"

[env]
  PYTHONUNBUFFERED = "1"
  PRODUCTION = "true"

[mounts]
  source = "data"
  destination = "/data"
  initial_size = "1GB"

[[services]]
  internal_port = 8080
  protocol = "tcp"

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  # Health check (optional - for monitoring)
  [[services.tcp_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"
    restart_limit = 0

# Resource allocation (Fly.io free tier compatible)
[vm]
  size = "shared-cpu-1x"  # 256MB RAM
  memory = "256mb"
  cpus = 1
